<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Page</title>
</head>
<body>
    <h2>Welcome to Post Page</h2>
    {% for post_number in post_data %}
        <div>
            <a href="{{ url_for('individual_post', post_id=post_number) }}">{{ post_data[post_number]["title"] }}</a>
        </div>
    {% endfor %}
    <a href="{{ url_for('homepage') }}">Back to Home</a>
</body>
</html>
